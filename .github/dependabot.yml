# Dependabot version updates.
# Uncomment the ecosystems this project uses. Updates are grouped
# into one weekly PR per ecosystem to keep noise low.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

