name: release
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        run: echo "release_version=0.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
  call-release:
    needs: resolve-version
    uses: jhunufernandes/github-actions/.github/workflows/release.yml@main
    with:
      release_version: ${{ needs.resolve-version.outputs.release_version }}
